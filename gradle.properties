# Project Metadata
mod_version_massive=0
mod_version_major=11
mod_version_minor=15
root_package=me.desht.pneumaticcraft
mod_id=pneumaticcraft-repressurized
mod_name=PneumaticCraft: Repressurized

# Minecraft Configuration
mc_version=1.12.2
forge_version=14.23.5.2847
mapping_channel=stable
mapping_version=39

# Dependency Versions (maintained from original)
jei_version=4.16.1.302
cofhcore_version=4.5.3.20
redstone_flux_version=2.0.2.3
mcmultipart_version=2.3.3
oc_version=1.7.2.71
computercraft_version=1.80pr1-build5
hwyla_version=1.8.26-B41_1.12.2
top_version=1.12-1.4.18-10
crafttweaker_version=4.0.9.285
ae2_version=rv6-stable-6
igwmod_version=1.4.3-14
thaumcraft_version=1.12.2:6.1.BETA16
botania_version=r1.10-355.4
ctm_version=MC1.12.2-0.3.2.18
albedo_version=2.0-SNAPSHOT
patchouli_version=1.0-23.6
immersive_engineering_version=0.12-90-521
mekanism_version=1.12.2-9.4.3.330
baubles_version=1.12-1.5.2
tan_version=1.12.2-3.1.0.140

# Build Configuration
use_access_transformer=true
access_transformer_locations=pneumaticcraft_at.cfg
use_mixins=true
mixin_booter_version=10.2
mixin_configs=pneumaticcraft
mixin_refmap=mixins.pneumaticcraft.refmap.json

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
# Good for debugging artifacts before uploading to remote maven
# GitHub actions won't run if this is true, test this by running the task `publishToMavenLocal`
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Publishing to CurseForge (Provide secret: CURSEFORGE_TOKEN)
# To configure dependencies, head to publishing.gradle's curseforge block
publish_to_curseforge = false
# CurseForge project ID must be the numerical ID and not the slug
curseforge_project_id =
curseforge_debug = false

# Publishing to Modrinth (Provide secret: MODRINTH_TOKEN), the token must have the `CREATE_VERSION` and `PROJECT_WRITE` permissions
# To configure dependencies, head to publishing.gradle's modrinth block
publish_to_modrinth = false
modrinth_project_id =
# Allows gradle to publish updated READMEs to the project body (via the modrinthSyncBody task)
modrinth_sync_readme = false
modrinth_debug = false